apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      initContainers:
        - name: increase-vm-max-map-count
          image: busybox
          imagePullPolicy: IfNotPresent
          command: ["sysctl", "-w", "vm.max_map_count=1048575"]
          securityContext:
            privileged: true
      containers:
        - name: cassandra
          image: cassandra:5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9042
              name: cql
          env:
            - name: MAX_HEAP_SIZE
              value: "512M"
            - name: HEAP_NEWSIZE
              value: "128M"
            - name: CASSANDRA_CLUSTER_NAME
              value: "cassandra-cluster"
            - name: JVM_OPTS
              value: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:+DisableExplicitGC"
          resources:
            requests:
              memory: "1536Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          # Startup probe: gives Cassandra up to 5 minutes to open port 9042.
          # Liveness and readiness probes don't run until this passes.
          startupProbe:
            tcpSocket:
              port: 9042
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          # Readiness: pod is only added to the Service once this passes.
          readinessProbe:
            tcpSocket:
              port: 9042
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          # Liveness: if Cassandra stops responding after startup, restart it.
          livenessProbe:
            tcpSocket:
              port: 9042
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
