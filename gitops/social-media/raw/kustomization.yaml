apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace-limits.yaml
  - 02-postgres-service.yaml
  - 03-postgres-statefulset.yaml
  - 04-backend-service.yaml
  - 05-backend-deployment.yaml
  - 06-frontend-service.yaml
  - 07-frontend-deployment.yaml
  - 08-microservice-go-service.yaml
  - 09-microservice-go-deployment.yaml
  - 10-microservice-java-service.yaml
  - 11-microservice-java-deployment.yaml
  - 12-kafka-statefulset.yaml
  - 13-kafka-service.yaml
  # 08-microservice-go-deployment.yaml points SPRING/GO caches at Service
  # "redis" and 11-microservice-java-deployment.yaml at Service "cassandra" --
  # both Deploys were in this list, their backends were not, so the two
  # microservices came up CrashLoopBackOff with "redis: Name or service not
  # known" / "cassandra: Name or service not known" while ArgoCD still called
  # the app Healthy. cassandra:5.0 is pre-imported onto every kind node by
  # prod-social's null_resource.kind_images, same as cp-kafka.
  - 14-cassandra-statefulset.yaml
  - 15-cassandra-service.yaml
  - 16-redis-deployment.yaml
  - 17-redis-service.yaml
  - 18-minio-service.yaml
  - 19-minio-deployment.yaml
  - 20-ingress-api.yaml
  - 21-ingress-minio.yaml
  - 22-ingress-frontend.yaml