{% extends "blog/layout.html" %}
{% block title %}Delete Post — Inkwell{% endblock %}
{% block content %}
<div class="narrow-xs">
  <div class="glass card-shell is-danger">
    <span class="tag danger">Danger zone</span>
    <h1 class="display confirm-title">Delete post</h1>
    <p class="confirm-copy">Are you sure you want to delete <strong>"{{ post.title }}"</strong>? This cannot be undone.</p>
    <hr class="divider">
    <form method="post" class="form-row">
      {% csrf_token %}
      <button type="submit" class="btn-primary danger">Yes, delete</button>
      <a href="{% url 'post_detail' post.pk %}" class="btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
