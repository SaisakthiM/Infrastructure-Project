{% extends "blog/layout.html" %}
{% block title %}New Post — Inkwell{% endblock %}
{% block content %}
<div style="max-width:640px;margin:0 auto;">
  <span class="tag">Writing</span>
  <h1 class="display" style="font-size:2rem;margin:.5rem 0 1.6rem;">Create new post</h1>
  <div class="glass" style="padding:1.8rem;border-radius:18px;">
    <form method="post" enctype="multipart/form-data" style="display:flex;flex-direction:column;gap:1.1rem;">
      {% csrf_token %}
      {% for field in form %}
        <div><label>{{ field.label }}</label>{{ field }}{% for e in field.errors %}<p class="bad" style="font-size:.8rem;margin-top:.25rem;">{{ e }}</p>{% endfor %}</div>
      {% endfor %}
      <div>
        <label>Cover image</label>
        <input type="file" name="image" accept="image/*" id="coverImageInput">
        <div id="imagePreviewWrapper" style="display:none;margin-top:.7rem;position:relative;border-radius:10px;overflow:hidden;">
          <img id="imagePreview" style="width:100%;max-height:200px;object-fit:cover;display:block;" alt="Preview">
          <button type="button" onclick="clearImage()" style="position:absolute;top:.4rem;right:.4rem;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:6px;cursor:pointer;padding:.2rem .55rem;font-size:.75rem;">✕ Remove</button>
        </div>
      </div>
      <button type="submit" class="btn-primary" style="margin-top:.4rem;">Publish post</button>
    </form>
  </div>
</div>
<script>
  const input=document.getElementById('coverImageInput'),preview=document.getElementById('imagePreview'),wrapper=document.getElementById('imagePreviewWrapper');
  input.addEventListener('change',function(){if(this.files&&this.files[0]){const r=new FileReader();r.onload=e=>{preview.src=e.target.result;wrapper.style.display='block'};r.readAsDataURL(this.files[0])}});
  function clearImage(){input.value='';preview.src='';wrapper.style.display='none';}
</script>
{% endblock %}
