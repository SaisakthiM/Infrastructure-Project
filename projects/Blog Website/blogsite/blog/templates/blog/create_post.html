{% extends "blog/layout.html" %}
{% block title %}New Post — Inkwell{% endblock %}
{% block content %}
<div class="narrow">
  <span class="tag">Writing</span>
  <h1 class="display form-title">Create new post</h1>
  <div class="glass card-shell">
    <form method="post" enctype="multipart/form-data" class="stack-form">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label>{{ field.label }}</label>{{ field }}
          {% for e in field.errors %}<p class="field-error">{{ e }}</p>{% endfor %}
        </div>
      {% endfor %}
      <div>
        <label for="coverImageInput">Cover image</label>
        <input type="file" name="image" accept="image/*" id="coverImageInput">
        <div id="imagePreviewWrapper" class="cover-preview">
          <img id="imagePreview" alt="Preview">
          <button type="button" id="clearImageBtn" class="cover-clear">✕ Remove</button>
        </div>
      </div>
      <button type="submit" class="btn-primary">Publish post</button>
    </form>
  </div>
</div>
<script>
  const input = document.getElementById('coverImageInput');
  const preview = document.getElementById('imagePreview');
  const wrapper = document.getElementById('imagePreviewWrapper');
  input.addEventListener('change', function () {
    if (this.files && this.files[0]) {
      const r = new FileReader();
      r.onload = (e) => { preview.src = e.target.result; wrapper.classList.add('is-visible'); };
      r.readAsDataURL(this.files[0]);
    }
  });
  document.getElementById('clearImageBtn').addEventListener('click', function () {
    input.value = '';
    preview.removeAttribute('src');
    wrapper.classList.remove('is-visible');
  });
</script>
{% endblock %}
