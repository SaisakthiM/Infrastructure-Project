{% extends "blog/layout.html" %}
{% block title %}Edit Post — Inkwell{% endblock %}
{% block content %}
<div class="narrow">
  <a href="{% url 'post_detail' post.pk %}" class="back-link">← Back to post</a>
  <h1 class="display form-title">Edit post</h1>
  <div class="glass card-shell">
    <form method="post" class="stack-form">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label>{{ field.label }}</label>{{ field }}
          {% for e in field.errors %}<p class="field-error">{{ e }}</p>{% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn-primary">Save changes</button>
    </form>
  </div>
</div>
{% endblock %}
