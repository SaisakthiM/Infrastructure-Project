{% extends "blog/layout.html" %}
{% block title %}Edit Post — Inkwell{% endblock %}
{% block content %}
<div style="max-width:640px;margin:0 auto;">
  <a href="{% url 'post_detail' post.pk %}" class="eyebrow" style="text-decoration:none;color:var(--muted);">← Back to post</a>
  <h1 class="display" style="font-size:2rem;margin:.8rem 0 1.6rem;">Edit post</h1>
  <div class="glass" style="padding:1.8rem;border-radius:18px;">
    <form method="post" style="display:flex;flex-direction:column;gap:1.1rem;">
      {% csrf_token %}
      {% for field in form %}
        <div><label>{{ field.label }}</label>{{ field }}{% for e in field.errors %}<p class="bad" style="font-size:.8rem;margin-top:.25rem;">{{ e }}</p>{% endfor %}</div>
      {% endfor %}
      <button type="submit" class="btn-primary" style="margin-top:.4rem;">Save changes</button>
    </form>
  </div>
</div>
{% endblock %}
