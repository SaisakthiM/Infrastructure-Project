{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore — Health Services 3D | Neo City</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'tailwind.min.css' %}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239fdded'><path d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm4 11h-3v3a1 1 0 0 1-2 0v-3H8a1 1 0 0 1 0-2h3V8a1 1 0 0 1 2 0v3h3a1 1 0 0 1 0 2z'/></svg>">
    <style>
        *{box-sizing:border-box}
        :root{
            --bg: #070d18;
            --surface: rgba(13, 23, 40, 0.88);
            --border: rgba(159, 221, 237, 0.22);
            --border-lit: rgba(159, 221, 237, 0.6);
            --navy:#070d18;--navy2:#0f1d33;
            --sky:#9fdded;--cyan:#00f0c8;--teal:#0ea5e9;
            --green:#10b981;--muted:#94a3b8;--text:#f1f5f9;
            --syne:'Syne',sans-serif;--mono:'JetBrains Mono','DM Mono',monospace;
        }
        body{font-family:var(--mono);background:var(--bg);color:var(--text);min-height:100vh;margin:0;overflow-x:hidden}
        #hospital-3d-bg{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
        .layout{display:flex;min-height:100vh;position:relative;z-index:1}
        .sidebar{width:260px;background:linear-gradient(180deg,rgba(11,21,38,0.96) 0%,rgba(7,13,24,0.98) 100%);min-height:100vh;display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:40;border-right:1px solid var(--border);backdrop-filter:blur(16px);box-shadow:4px 0 24px rgba(0,0,0,.6)}
        .main-area{margin-left:260px;flex:1;display:flex;flex-direction:column;min-width:0}
        .sb-logo{padding:26px 20px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.06)}
        .sb-logo-icon{width:42px;height:42px;background:linear-gradient(135deg,rgba(159,221,237,0.2),rgba(14,165,233,0.3));border:1px solid var(--sky);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 16px rgba(159,221,237,.3)}
        .sb-logo-name{color:#fff;font-family:var(--syne);font-size:1.15rem;font-weight:800;letter-spacing:-0.02em}
        .sb-logo-sub{color:var(--sky);font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
        .sb-nav{padding:20px 12px;flex:1}
        .nav-sec{color:rgba(255,255,255,.35);font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:0 12px;margin:16px 0 6px}
        .nav-link{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;color:rgba(255,255,255,.7);font-size:.85rem;font-weight:500;text-decoration:none;transition:all .18s;margin-bottom:3px}
        .nav-link:hover{background:rgba(159,221,237,.1);color:var(--sky)}
        .nav-link.active{background:linear-gradient(90deg,rgba(159,221,237,.2),rgba(14,165,233,.05));color:#fff;border-left:3px solid var(--sky)}
        .nav-link svg{width:18px;height:18px;flex-shrink:0}
        .sb-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.06)}
        .sb-footer-inner{display:flex;align-items:center;gap:10px}
        .avatar{width:36px;height:36px;background:linear-gradient(135deg,var(--sky),var(--teal));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#070d18;flex-shrink:0}
        .avatar-name{color:#fff;font-size:.8rem;font-weight:600}
        .avatar-role{color:var(--sky);font-size:.7rem}
        .topbar{background:rgba(13,23,40,0.85);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;backdrop-filter:blur(16px)}
        .topbar-title{font-family:var(--syne);font-size:1.15rem;font-weight:800;color:#fff}
        .topbar-right{display:flex;align-items:center;gap:16px}
        .status-pill{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);color:#34d399;font-size:.72rem;font-weight:600;padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
        .pulse-dot{width:7px;height:7px;background:#34d399;border-radius:50%;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
        .topbar-time{font-size:.8rem;color:var(--muted)}
        .page-content{padding:32px;flex:1}
        .page-header{margin-bottom:28px;display:flex;align-items:flex-end;justify-content:space-between}
        .page-title{font-family:var(--syne);font-size:1.6rem;font-weight:800;color:#fff;line-height:1.2}
        .page-sub{font-size:.82rem;color:var(--muted);margin-top:4px}
        .card{background:var(--surface);border-radius:14px;box-shadow:0 0 20px rgba(0,0,0,.4);border:1px solid var(--border);backdrop-filter:blur(14px);overflow:hidden}
        .card-header{padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
        .card-title{font-family:var(--syne);font-size:1.05rem;font-weight:700;color:#fff}
        .card-body{padding:24px}
        .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;font-size:.85rem;font-weight:700;text-decoration:none;border:none;cursor:pointer;transition:all .18s;line-height:1;font-family:var(--mono)}
        .btn-primary{background:linear-gradient(135deg,var(--sky),var(--teal));color:#070d18;box-shadow:0 0 16px rgba(159,221,237,.35)}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 0 24px rgba(159,221,237,.5)}
        .btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
        .form-group{margin-bottom:20px}
        .form-label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:7px;letter-spacing:.08em;text-transform:uppercase}
        .form-control{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:.88rem;font-family:var(--mono);color:#fff;background:rgba(7,13,24,0.7);transition:all .18s}
        .form-control:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(159,221,237,.15)}
        .data-table{width:100%;border-collapse:separate;border-spacing:0}
        .data-table thead th{background:rgba(11,21,38,0.85);padding:12px 16px;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sky);border-bottom:1px solid var(--border);text-align:left}
        .data-table tbody tr{transition:background .12s}
        .data-table tbody tr:hover{background:rgba(159,221,237,.06)}
        .data-table tbody td{padding:14px 16px;font-size:.85rem;color:#cbd5e1;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
        .link-edit{color:var(--sky);font-weight:600;font-size:.82rem;text-decoration:none;padding:5px 10px;border-radius:6px;transition:background .15s}
        .link-edit:hover{background:rgba(159,221,237,.15)}
        .stat-card{border-radius:14px;padding:22px;border:1px solid var(--border);color:#fff;backdrop-filter:blur(14px)}
        .stat-icon{width:44px;height:44px;border-radius:10px;background:rgba(159,221,237,.15);border:1px solid var(--sky);display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--sky)}
        .stat-label{font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
        .stat-value{font-family:var(--syne);font-size:2.2rem;font-weight:800;color:var(--sky)}
        .stat-sub{font-size:.7rem;color:var(--muted);margin-top:6px}
        .stat-doctors{background:linear-gradient(135deg,rgba(11,37,69,0.8),rgba(19,64,116,0.6))}
        .stat-patients{background:linear-gradient(135deg,rgba(13,148,136,0.7),rgba(8,145,178,0.5))}
        .stat-appts{background:linear-gradient(135deg,rgba(124,58,237,0.7),rgba(79,70,229,0.5))}
        .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
        .form-card-wrap{max-width:560px;margin:0 auto}
        .empty-state{padding:48px 24px;text-align:center;color:var(--muted)}
    </style>
</head>
<body>
<canvas id="hospital-3d-bg"></canvas>
<div class="layout">

  <!-- ═══ Sidebar ═══ -->
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7v4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/>
          <path d="M14 9h-4"/>
          <path d="M18 11h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2"/>
          <path d="M18 21V5a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16"/>
        </svg>
      </div>
      <div>
        <div class="sb-logo-name">MediCore</div>
        <div class="sb-logo-sub">Hospital System</div>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="nav-sec">Overview</div>
      <a href="{% url 'dashboard' %}" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Dashboard
      </a>

      <div class="nav-sec">Management</div>
      <a href="{% url 'manage_patients' %}" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Patients
      </a>
      <a href="{% url 'manage_doctors' %}" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <circle cx="12" cy="13" r="2"/>
          <path d="M12 11v-2"/><path d="M12 15v1"/><path d="M10 13H9"/><path d="M14 13h1"/>
        </svg>
        Doctors
      </a>
      <a href="{% url 'manage_appointments' %}" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Appointments
      </a>
    </nav>

    <div class="sb-footer">
      <div class="sb-footer-inner">
        <div class="avatar">A</div>
        <div>
          <div class="avatar-name">Admin</div>
          <div class="avatar-role">System Administrator</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ═══ Main ═══ -->
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-title">Hospital Management System</div>
      <div class="topbar-right">
        <div class="status-pill"><div class="pulse-dot"></div> System Online</div>
        <div class="topbar-time" id="live-time"></div>
      </div>
    </header>

    <main class="page-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
  function updateTime(){var e=document.getElementById('live-time');if(e)e.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
  updateTime();setInterval(updateTime,1000);
  document.querySelectorAll('.nav-link').forEach(function(l){if(l.href===window.location.href)l.classList.add('active');});

  // ── Three.js 3D Health Core Background ──
  (function initHospital3D() {
    const canvas = document.getElementById('hospital-3d-bg');
    if (!canvas || !window.THREE) return;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x070d18, 0.025);
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4, 18);

    // Neon Grid
    const grid = new THREE.GridHelper(60, 30, 0x9fdded, 0x0f2438);
    grid.position.y = -4;
    grid.material.opacity = 0.25;
    grid.material.transparent = true;
    scene.add(grid);

    // Rotating 3D DNA Double Helix
    const helixGroup = new THREE.Group();
    helixGroup.position.set(12, 1, -2);
    scene.add(helixGroup);

    const sphereGeo = new THREE.SphereGeometry(0.18, 12, 12);
    const cyanMat = new THREE.MeshBasicMaterial({ color: 0x9fdded });
    const blueMat = new THREE.MeshBasicMaterial({ color: 0x0ea5e9 });

    for (let i = 0; i < 40; i++) {
      const t = i * 0.35;
      const y = (i - 20) * 0.45;
      const x1 = Math.cos(t) * 2.2;
      const z1 = Math.sin(t) * 2.2;
      const x2 = Math.cos(t + Math.PI) * 2.2;
      const z2 = Math.sin(t + Math.PI) * 2.2;

      const s1 = new THREE.Mesh(sphereGeo, cyanMat);
      s1.position.set(x1, y, z1);
      helixGroup.add(s1);

      const s2 = new THREE.Mesh(sphereGeo, blueMat);
      s2.position.set(x2, y, z2);
      helixGroup.add(s2);

      if (i % 2 === 0) {
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(x1, y, z1),
          new THREE.Vector3(x2, y, z2)
        ]);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x9fdded, transparent: true, opacity: 0.35 });
        helixGroup.add(new THREE.Line(lineGeo, lineMat));
      }
    }

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      helixGroup.rotation.y = time * 0.4;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();
</script>
</body>
</html>
