# Local bank web server: http://localhost:3000/  ->  /bank/ (UI)   and   /bank/api/ -> Spring (/api/)
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;

    location = / { return 302 /bank/; }

    location /bank/api/ {
        set $up http://backend:8080;
        rewrite ^/bank/api/(.*)$ /api/$1 break;
        proxy_pass $up;
        proxy_connect_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        error_page 502 503 504 = @bank_down;
    }
    location @bank_down {
        default_type application/json;
        return 503 '{"success":false,"message":"Bank unavailable"}';
    }

    # the UI is built with base=/bank/, so the volume root is served under /bank/
    location /bank/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /bank/index.html;
    }
}
