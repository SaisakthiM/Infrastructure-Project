spring.application.name=fileHandling

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

server.port=8080

management.endpoints.web.exposure.include=prometheus,health
management.endpoint.prometheus.enabled=true

# Where views/likes/earnings are stored (mount a volume; override with DATA_DIR or CITY_DATA_DIR)
city.data-dir=${CITY_DATA_DIR:}
# Used to verify citizens (their JWT is replayed against the bank)
city.bank.api-url=${CITY_BANK_API_URL:http://bank-backend:8080/api}
