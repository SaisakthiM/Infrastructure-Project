# Run from this directory:
#   docker compose run --rm enum
#   PEAK_VUS=5 docker compose run --rm k6-public
#   APP=notes PEAK_VUS=3 docker compose run --rm k6-apps
#   APP=notes WRITES=1 WRITE_CAP=20 docker compose run --rm k6-apps
# APP = notes | bank | whisper | hospital | video | social
x-env: &env
  BASE_URL: ${BASE_URL:-https://saisakthi.qzz.io}

services:
  enum:
    image: python:3.12-slim
    working_dir: /work
    volumes: ["./:/work"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *env
      RATE: ${RATE:-5}
    command: sh -c "pip install -q requests && python enumeration.py"

  k6-public:
    image: grafana/k6:latest
    volumes: ["./:/work"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *env
      MODE: public
      PEAK_VUS: ${PEAK_VUS:-5}
    command: ["run", "/work/loadtest.js"]

  k6-apps:
    image: grafana/k6:latest
    volumes: ["./:/work"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *env
      APP: ${APP:-notes}
      PEAK_VUS: ${PEAK_VUS:-3}
      WRITES: ${WRITES:-0}
      WRITE_CAP: ${WRITE_CAP:-20}
      NOTE_JSON: ${NOTE_JSON:-}
    command: ["run", "/work/loadtest-apps.js"]