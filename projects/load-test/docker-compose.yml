# Usage (from this directory):
#   docker compose run --rm enum
#   docker compose run --rm k6-public
#   docker compose run --rm k6-auth
# Test locally instead of through Cloudflare:
#   BASE_URL=http://host.docker.internal docker compose run --rm enum
x-env: &env
  BASE_URL: ${BASE_URL:-https://saisakthi.qzz.io}

services:
  enum:
    image: python:3.12-slim
    working_dir: /work
    volumes: ["./:/work"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *env
      RATE: ${RATE:-5}            # requests per second, global
    command: sh -c "pip install -q requests && python enumeration.py"

  k6-public:
    image: grafana/k6:latest
    volumes: ["./:/work"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *env
      MODE: public
      PEAK_VUS: ${PEAK_VUS:-20}
    command: ["run", "/work/loadtest.js"]

  k6-auth:
    image: grafana/k6:latest
    volumes: ["./:/work"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *env
      MODE: auth
      PEAK_VUS: ${PEAK_VUS:-10}
      REGISTER_URL: ${REGISTER_URL:-}      # e.g. /notes/api/register/
      LOGIN_URL: ${LOGIN_URL:-}            # e.g. /notes/api/login/
      USER_FIELD: ${USER_FIELD:-username}
      PASS_FIELD: ${PASS_FIELD:-password}
      EXTRA_REGISTER_JSON: ${EXTRA_REGISTER_JSON:-{}}   # e.g. {"email":"lt@example.com"}
      TOKEN_FIELD: ${TOKEN_FIELD:-access}  # JSON key holding the JWT in the login response
      AUTH_SCHEME: ${AUTH_SCHEME:-Bearer}
      AUTHED_PATHS: ${AUTHED_PATHS:-}      # comma-separated GET paths, e.g. /notes/api/notes/
    command: ["run", "/work/loadtest.js"]
