# Mini City gateway (local docker-compose). Production keeps its own copy in the environment/terraform folder:
# mirror the city-core, grocery, housing, api-service blocks and the proxy fixes marked "FIX" there.
server {
    listen 80 default_server;
    # any host that reaches this container is served (localhost, 127.0.0.1, a LAN name…); `_` is the catch-all
    server_name localhost 127.0.0.1 _;

    # Every upstream below is resolved when a request arrives (Docker's DNS + a variable), NOT when nginx starts.
    # FIX: with a plain proxy_pass, one container that is down ("host not found in upstream") stops the whole
    # gateway from booting. Now a missing service only makes ITS location answer 502/503.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── shared city core: three.js, models, textures, bank client, login gate, skin, css (static, same origin) ──
    location ^~ /city-core/ {
        root /apps;
        default_type application/octet-stream;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── notes ─────────────────────────────────────────────────
    location /notes/api/ {
        set $up http://notes-backend:8000;
        rewrite ^/notes/api/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /notes/ {
        root /apps;
        try_files $uri $uri/ /notes/index.html;
    }

    # ── bank ──────────────────────────────────────────────────
    # FIX: the Spring controllers are mounted at /api/..., so /bank/api/ must map to /api/ (not to /)
    # If the bank container is down / unreachable the city client needs a clean "bank down" signal: 503 JSON.
    location /bank/api/ {
        set $up http://bank-backend:8080;
        rewrite ^/bank/api/(.*)$ /api/$1 break;
        proxy_pass $up;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 503 504 = @bank_down;
    }
    location @bank_down {
        default_type application/json;
        return 503 '{"success":false,"message":"Bank unavailable"}';
    }
    # The bank UI. `$uri/index.html` (not `$uri/`) so a folder without an index file gives a readable message
    # instead of nginx's bare "403 Forbidden".
    location = /bank/ {
        root /apps;
        try_files /bank/index.html =404;
        error_page 404 = @bank_ui_missing;
    }
    location /bank/ {
        root /apps;
        try_files $uri $uri/index.html /bank/index.html =404;
    }
    location @bank_ui_missing {
        default_type text/html;
        return 503 '<!doctype html><meta charset=utf-8><title>Bank UI not found</title><body style="font:15px/1.6 system-ui;background:#060913;color:#eef2f8;display:grid;place-items:center;min-height:100vh;margin:0"><div style="max-width:520px;padding:24px"><h2 style="margin:0 0 8px">Bank UI is not mounted in the gateway</h2><p style="color:#8d9bb0">/apps/bank/index.html does not exist inside the gateway container. Mount the built bank frontend at /apps/bank (see bank-localhost/README.md). The bank API itself is separate: /bank/api/.</p></div></body>';
    }

    # ── quiz ──────────────────────────────────────────────────
    location /quiz/ {
        root /apps;
        try_files $uri $uri/ /quiz/index.html;
    }

    # ── media / video ─────────────────────────────────────────
    # FIX: uploads are up to 200 MB (nginx's default is 1 MB, which silently broke video uploads)
    location /video/api/ {
        client_max_body_size 220m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        set $up http://video-uploader-backend:8080;
        rewrite ^/video/api/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /video/ {
        root /apps;
        try_files $uri $uri/ /video/index.html;
    }

    # ── hospital (Django serves everything under /hospital/, including /hospital/static/) ──
    # FIX: the proxy_pass target has no URI part, so the /hospital/ prefix is kept (Django's URLs include it)
    location /hospital/ {
        set $up http://hospital-management:8000;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── grocery ───────────────────────────────────────────────
    location /grocery/api/ {
        set $up http://grocery-backend:8000;
        rewrite ^/grocery/api/(.*)$ /api/$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /grocery/ {
        root /apps;
        try_files $uri $uri/ /grocery/index.html;
    }

    # ── housing ───────────────────────────────────────────────
    location /housing/api/ {
        set $up http://housing-backend:8000;
        rewrite ^/housing/api/(.*)$ /api/$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /housing/ {
        root /apps;
        try_files $uri $uri/ /housing/index.html;
    }

    # ── api service (weather, geocoding, markets, world data, city exchange) ──
    # the frontend calls /api-service/api/api/weather/ -> backend /api/weather/
    location /api-service/api/ {
        set $up http://api-service-backend:8000;
        rewrite ^/api-service/api/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # hashed build assets can be cached hard; the page itself must never be (that is how a stale deploy hides)
    location ^~ /api-service/assets/ {
        root /apps;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /api-service/ {
        root /apps;
        try_files $uri $uri/index.html /api-service/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        error_page 404 = @api_ui_missing;
    }
    location @api_ui_missing {
        default_type text/html;
        return 503 '<!doctype html><meta charset=utf-8><title>API Service not published</title><body style="font:15px/1.6 system-ui;background:#060913;color:#eef2f8;display:grid;place-items:center;min-height:100vh;margin:0"><div style="max-width:560px;padding:24px"><h2 style="margin:0 0 8px">API Service UI has not been published yet</h2><p style="color:#8d9bb0">Run: docker compose -f docker-compose.yml -f docker-compose.city.yml up -d --build api-service-frontend-build gateway<br>then check docker compose logs api-service-frontend-build. /api-service/build.txt shows when the files served here were published.</p></div></body>';
    }

    # ── blog / social ─────────────────────────────────────────
    location /blog/ {
        set $up http://blog-website:8000;
        rewrite ^/blog/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /social/ {
        proxy_pass http://172.18.0.2:30080/social/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── whisper (template — fill in YOUR service names / ports, then uncomment) ──────────────
    # Whisper = Rust/Axum API + WebSocket + React build. The WebSocket needs the Upgrade headers below.
    # The React build must be served from the same gateway so it can load /city-core/city-skin.js (3D backdrop).
    #
    # location /whisper/api/ {
    #     set $up http://whisper-backend:3000;
    #     rewrite ^/whisper/api/(.*)$ /$1 break;
    #     proxy_pass $up;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 3600s;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location /whisper/ {
    #     root /apps;
    #     try_files $uri $uri/ /whisper/index.html;
    # }

    location / {
        return 200 '{"status":"gateway running","apps":["/notes/","/bank/","/quiz/","/video/","/hospital/","/grocery/","/housing/","/api-service/","/blog/","/social/"]}';
        add_header Content-Type application/json;
    }
}
