# Mini City gateway (local docker-compose). Production keeps its own copy in the environment/terraform folder:
# mirror the city-core, grocery, housing, api-service blocks and the proxy fixes marked "FIX" there.
server {
    listen 80;
    server_name localhost;

    # ── shared city core: three.js, models, textures, bank client, css (static, same origin as every district) ──
    location ^~ /city-core/ {
        root /apps;
        default_type application/octet-stream;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── notes ─────────────────────────────────────────────────
    location /notes/api/ {
        proxy_pass http://notes-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /notes/ {
        root /apps;
        try_files $uri $uri/ /notes/index.html;
    }

    # ── bank ──────────────────────────────────────────────────
    # FIX: the Spring controllers are mounted at /api/..., so /bank/api/ must map to /api/ (not to /)
    location /bank/api/ {
        proxy_pass http://bank-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /bank/ {
        root /apps;
        try_files $uri $uri/ /bank/index.html;
    }

    # ── quiz ──────────────────────────────────────────────────
    location /quiz/ {
        root /apps;
        try_files $uri $uri/ /quiz/index.html;
    }

    # ── media / video ─────────────────────────────────────────
    # FIX: uploads are up to 200 MB (nginx's default is 1 MB, which silently broke video uploads)
    location /video/api/ {
        client_max_body_size 220m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://video-uploader-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /video/ {
        root /apps;
        try_files $uri $uri/ /video/index.html;
    }

    # ── hospital (Django serves everything under /hospital/, including /hospital/static/) ──
    # FIX: no trailing slash on proxy_pass, so the /hospital/ prefix is kept (Django's URLs include it)
    location /hospital/ {
        proxy_pass http://hospital-management:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── grocery ───────────────────────────────────────────────
    location /grocery/api/ {
        proxy_pass http://grocery-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /grocery/ {
        root /apps;
        try_files $uri $uri/ /grocery/index.html;
    }

    # ── housing ───────────────────────────────────────────────
    location /housing/api/ {
        proxy_pass http://housing-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /housing/ {
        root /apps;
        try_files $uri $uri/ /housing/index.html;
    }

    # ── api service (weather, geocoding, markets, world data, city exchange) ──
    # the frontend calls /api-service/api/api/weather/ -> backend /api/weather/
    location /api-service/api/ {
        proxy_pass http://api-service-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api-service/ {
        root /apps;
        try_files $uri $uri/ /api-service/index.html;
    }

    # ── blog / social ─────────────────────────────────────────
    location /blog/ {
        proxy_pass http://blog-website:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /social/ {
        proxy_pass http://172.18.0.2:30080/social/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 200 '{"status":"gateway running","apps":["/notes/","/bank/","/quiz/","/video/","/hospital/","/grocery/","/housing/","/api-service/","/blog/","/social/"]}';
        add_header Content-Type application/json;
    }
}
